<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construcción del sólido mediante envolventes cilíndricas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--navy:#12324a;--muted:#526b7d;--border:#d7e3e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef5f7;font-family:Arial,sans-serif;color:var(--navy)}main{width:min(1160px,96vw);padding:22px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 15px 38px rgba(18,50,74,.13)}h1{margin:0 0 5px;font-size:1.45rem}.lead{margin:0 0 13px;color:var(--muted);line-height:1.45}.stage{position:relative;border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#fff;aspect-ratio:2/1}#scene{position:absolute;inset:0}#scene canvas{display:block;width:100%;height:100%}.phase{position:absolute;z-index:5;left:16px;top:14px;max-width:70%;padding:.42rem .68rem;border-radius:8px;background:rgba(255,255,255,.94);border:1px solid var(--border);font-weight:700}.controls{display:flex;justify-content:center;gap:.65rem;margin-top:14px}button{border:1px solid #c59a28;border-radius:9px;background:#fff9e9;color:#6f5209;padding:.55rem .9rem;font-weight:700;cursor:pointer}.embedded body{min-height:0;background:#fff}.embedded main{width:100%;padding:0;border:0;border-radius:0;box-shadow:none}.embedded h1,.embedded .lead,.embedded .controls{display:none}.embedded .stage{border:0;border-radius:0}@media(max-width:700px){main{padding:12px}.phase{font-size:.72rem;left:8px;top:8px;max-width:88%}}
</style>
</head>
<body>
<main>
<h1>Construcción del sólido mediante envolventes cilíndricas</h1>
<p class="lead">Cada rectángulo vertical de altura <i>h</i>(<i>x</i><sub>i</sub>), radio <i>ρ</i>(<i>x</i><sub>i</sub>) y ancho Δ<i>x</i> gira alrededor del eje <i>y</i> y genera una envolvente cilíndrica delgada.</p>
<div class="stage"><div id="scene" aria-label="Animación tridimensional del método de envolventes cilíndricas"></div><div id="phase" class="phase">1. Región plana</div></div>
<div class="controls"><button id="toggle">Pausar</button><button id="restart">Reiniciar</button></div>
</main>
<script>
const params=new URLSearchParams(location.search);if(params.has('embedded'))document.documentElement.classList.add('embedded');
const host=document.getElementById('scene'),phase=document.getElementById('phase'),toggle=document.getElementById('toggle'),restart=document.getElementById('restart');
const T=41000,N=8,innerRadius=.48,outerRadius=3.55,colors=[0xc58a00,0x0057b8,0xd69a00,0xd85f0a,0x008c95,0xb97800,0x0b6380,0xc94b2c];
let scene,camera,renderer,root,start=performance.now(),paused=false,pauseAt=0,ready=false;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=v=>v<.5?2*v*v:1-Math.pow(-2*v+2,2)/2;
const heightAt=r=>{const t=clamp((r-innerRadius)/(outerRadius-innerRadius));return .72+2.65*Math.pow(Math.sin(Math.PI*(.08+.84*t)),.72)};
function disposeTree(object){object.traverse(o=>{o.geometry?.dispose();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material?.dispose()})}
function clearRoot(){while(root.children.length){const child=root.children.pop();disposeTree(child)}}
function material(color,opacity=1,side=THREE.DoubleSide){return new THREE.MeshPhongMaterial({color,side,transparent:opacity<1,opacity,shininess:48,depthWrite:opacity>.55})}
function init(){if(ready)return;scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);const w=host.clientWidth||1200,h=host.clientHeight||600,aspect=w/h;camera=new THREE.OrthographicCamera(-3.55*aspect,3.55*aspect,3.55,-3.55,.1,100);camera.position.set(6.3,2.28,7.7);camera.lookAt(0,1.5,0);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(w,h,false);renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0xb8c9d0,1.18));const key=new THREE.DirectionalLight(0xffffff,1.12);key.position.set(4,8,7);key.castShadow=true;scene.add(key);const warm=new THREE.DirectionalLight(0xffdda0,.48);warm.position.set(-5,3,-4);scene.add(warm);root=new THREE.Group();root.position.y=-.38;scene.add(root);ready=true}
function addFloor(alpha=.13){const floor=new THREE.Mesh(new THREE.CircleGeometry(4.25,96),new THREE.MeshPhongMaterial({color:0xdde8eb,transparent:true,opacity:alpha,side:THREE.DoubleSide}));floor.rotation.x=-Math.PI/2;floor.position.y=-.018;root.add(floor)}
function addAxis(alpha=.72){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-.08,0),new THREE.Vector3(0,4.05,0)]),m=new THREE.LineDashedMaterial({color:0x7357b8,dashSize:.14,gapSize:.1,transparent:true,opacity:alpha});const line=new THREE.Line(g,m);line.computeLineDistances();root.add(line)}
function regionGeometry(){const shape=new THREE.Shape();shape.moveTo(innerRadius,0);for(let i=0;i<=100;i++){const r=innerRadius+(outerRadius-innerRadius)*i/100;shape.lineTo(r,heightAt(r))}shape.lineTo(outerRadius,0);shape.closePath();return new THREE.ShapeGeometry(shape)}
function addRegion(opacity=.9){const mesh=new THREE.Mesh(regionGeometry(),material(0xe6a13e,opacity));mesh.position.z=.015;mesh.castShadow=true;root.add(mesh);const edge=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),new THREE.LineBasicMaterial({color:0x704b0b,transparent:true,opacity:.72}));edge.position.copy(mesh.position);root.add(edge)}
function bandData(i,n=N){const dr=(outerRadius-innerRadius)/n,r0=innerRadius+i*dr,r1=r0+dr,r=(r0+r1)/2;let h=Infinity;for(let j=0;j<=16;j++)h=Math.min(h,heightAt(r0+dr*j/16));return{r0,r1,r,dr,h}}
function addPartitions(progress=1,n=N){const count=Math.floor(n*clamp(progress));for(let i=1;i<=count;i++){const b=bandData(i-1,n),x=b.r1,h=heightAt(x),g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,0,.04),new THREE.Vector3(x,h,.04)]);root.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0x704b0b,transparent:true,opacity:.72})))} }
function addBand(i,opacity=.88,n=N){const b=bandData(i,n),mesh=new THREE.Mesh(new THREE.BoxGeometry(b.dr*.88,b.h,.075),material(colors[i%colors.length],opacity));mesh.position.set(b.r,b.h/2,.06);mesh.castShadow=true;root.add(mesh)}
function addShell(i,theta=Math.PI*2,opacity=.94,n=N,start=Math.PI,caps=true){if(theta<=.001)return;const b=bandData(i,n),segments=96,r0=b.r-b.dr*.44,r1=b.r+b.dr*.44;const mat=material(colors[i%colors.length],opacity);const outer=new THREE.Mesh(new THREE.CylinderGeometry(r1,r1,b.h,segments,1,true,start,theta),mat);outer.position.y=b.h/2;outer.castShadow=true;root.add(outer);const inner=new THREE.Mesh(new THREE.CylinderGeometry(r0,r0,b.h,segments,1,true,start,theta),material(colors[i%colors.length],opacity*.76,THREE.BackSide));inner.position.y=b.h/2;root.add(inner);const top=new THREE.Mesh(new THREE.RingGeometry(r0,r1,segments,1,start-Math.PI/2,theta),material(colors[i%colors.length],Math.min(1,opacity+.04)));top.rotation.x=-Math.PI/2;top.position.y=b.h;root.add(top);if(caps&&theta<Math.PI*1.999){for(const a of [start,start+theta]){const verts=new Float32Array([r0*Math.sin(a),0,r0*Math.cos(a),r1*Math.sin(a),0,r1*Math.cos(a),r1*Math.sin(a),b.h,r1*Math.cos(a),r0*Math.sin(a),b.h,r0*Math.cos(a)]),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(verts,3));g.setIndex([0,1,2,0,2,3]);g.computeVertexNormals();root.add(new THREE.Mesh(g,material(colors[i%colors.length],opacity)))}}}
function addSmoothSurface(reveal=1,opacity=.96){const radial=64,angular=Math.max(8,Math.ceil(112*clamp(reveal))),theta=Math.PI*2*clamp(reveal),positions=[],indices=[];for(let i=0;i<=radial;i++){const r=innerRadius+(outerRadius-innerRadius)*i/radial;for(let j=0;j<=angular;j++){const a=-Math.PI/2+theta*j/angular;positions.push(r*Math.cos(a),heightAt(r),r*Math.sin(a))}}for(let i=0;i<radial;i++)for(let j=0;j<angular;j++){const a=i*(angular+1)+j,b=a+angular+1;indices.push(a,b,a+1,b,b+1,a+1)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(indices);g.computeVertexNormals();const mesh=new THREE.Mesh(g,material(0xe4a13d,opacity));mesh.castShadow=true;root.add(mesh);const wire=new THREE.LineSegments(new THREE.WireframeGeometry(g),new THREE.LineBasicMaterial({color:0x80511e,transparent:true,opacity:.1}));root.add(wire);const outer=new THREE.Mesh(new THREE.CylinderGeometry(outerRadius,outerRadius,heightAt(outerRadius),96,1,true,-Math.PI/2,theta),material(0xd87838,opacity*.78));outer.position.y=heightAt(outerRadius)/2;root.add(outer);const inner=new THREE.Mesh(new THREE.CylinderGeometry(innerRadius,innerRadius,heightAt(innerRadius),96,1,true,-Math.PI/2,theta),material(0x9b5d26,opacity*.86,THREE.BackSide));inner.position.y=heightAt(innerRadius)/2;root.add(inner)}
function resize(){const w=host.clientWidth||1200,h=host.clientHeight||600,aspect=w/h,extent=3.55;camera.left=-extent*aspect;camera.right=extent*aspect;camera.top=extent;camera.bottom=-extent;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}
function renderFrame(now){init();const e=(now-start)%T;clearRoot();addFloor();addAxis();phase.style.display='block';
if(e<3500){phase.textContent='1. Región plana';addRegion()}
else if(e<7000){const q=ease((e-3500)/3500);phase.textContent='2. Partición en rectángulos verticales de ancho Δx';addRegion(.78);addPartitions(q)}
else if(e<11500){const q=ease((e-7000)/4500),chosen=3;phase.textContent='3. Un rectángulo gira y genera una envolvente cilíndrica';addRegion(.38);addPartitions(1);addBand(chosen,.9);addShell(chosen,Math.PI*2*q,.98)}
else if(e<20500){const q=ease((e-11500)/9000),count=Math.floor(q*N),part=q*N-count;phase.style.display='none';addRegion(.38);addPartitions(1);for(let i=0;i<count;i++)addShell(i,Math.PI,.93);if(count<N&&part>0){addBand(count,.96);addShell(count,Math.PI*part,.98)}}
else if(e<29500){const q=ease((e-20500)/9000),count=Math.floor(q*N),part=q*N-count;phase.style.display='none';addRegion(.38);addPartitions(1);for(let i=0;i<N;i++){addShell(i,Math.PI,.9,N,Math.PI,false);if(i<count)addShell(i,Math.PI,.9,N,0,false);else if(i===count&&part>0){addBand(i,.96);addShell(i,Math.PI*part,.98,N,0,true)}}}
else if(e<34000){const q=ease((e-29500)/4500);phase.textContent='4. Al refinar la partición, Δx → 0';for(let i=0;i<N;i++)addShell(i,Math.PI*2,.72*(1-q));addSmoothSurface(q,.2+.72*q)}
else{const q=ease(clamp((e-34000)/2500));phase.textContent='5. Las envolventes determinan el sólido de revolución';addSmoothSurface(1,.94);if(e>39500){addRegion(ease((e-39500)/1500));}}
resize();renderer.render(scene,camera);if(!paused)requestAnimationFrame(renderFrame)}
function setPausedState(value){if(value===paused)return;paused=value;if(paused){pauseAt=performance.now();toggle.textContent='Reproducir'}else{start+=performance.now()-pauseAt;toggle.textContent='Pausar';requestAnimationFrame(renderFrame)}}
toggle.onclick=()=>setPausedState(!paused);restart.onclick=()=>{start=performance.now();if(paused){paused=false;toggle.textContent='Pausar';requestAnimationFrame(renderFrame)}};window.addEventListener('message',event=>{if(event.data?.type==='shell-animation-control')setPausedState(Boolean(event.data.paused))});requestAnimationFrame(renderFrame);
</script>
</body>
</html>
